<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinitHQs</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

#bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center,
    #00ffff22 0%,
    #000000 70%);
}

.content{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

h1{
    font-size:6rem;
    text-shadow:0 0 25px cyan;
    animation: glow 2s infinite alternate;
}

p{
    color:#bbb;
    font-size:1.3rem;
}

@keyframes glow{
    from{
        text-shadow:0 0 20px cyan;
    }
    to{
        text-shadow:0 0 50px cyan;
    }
}

.orb{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:linear-gradient(cyan,#0088ff);
    filter:blur(40px);
    opacity:.5;
    animation:float 6s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-50px);}
    100%{transform:translateY(0px);}
}
</style>
</head>
<body>

<div id="bg"></div>

<div class="orb"></div>

<div class="content">
    <h1>VinitHQs</h1>
    <p>Minecraft • Coding • Gaming • Projects</p>
</div>

</body>
</html>]
